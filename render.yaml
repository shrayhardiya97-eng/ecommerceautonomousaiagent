# Render.com Infrastructure Blueprint
# Auto-deploys FastAPI Multi-Agent Backend + Managed PostgreSQL
services:
  - type: web
    name: ecommerce-ai-agent-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api.server:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-agent-db
          property: connectionString
      - key: QDRANT_COLLECTION
        value: products_catalog
      - key: SHOPIFY_SHOP_URL
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: ecommerce-agent-db
    plan: free
    region: oregon
    databaseName: ecommerce_agent
    user: ecommerce_user
