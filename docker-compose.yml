version: '3.8'

services:
  # 1. FastAPI AI Shopping Agent Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping_agent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_secure_pass@db:5432/ecommerce_agent
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=products_catalog
      - SHOPIFY_SHOP_URL=${SHOPIFY_SHOP_URL:-mystore.myshopify.com}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - ecommerce_network

  # 2. Next.js Storefront Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: shopping_agent_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ecommerce_network

  # 3. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: shopping_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: ecommerce_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/migrations.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: shopping_agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
